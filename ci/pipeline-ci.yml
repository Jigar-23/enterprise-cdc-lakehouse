name: Enterprise CDC & Delta Lakehouse CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job 1: Core Pipeline, Unit & Offline Integration Tests (Fast, No Docker Required)
  test-offline:
    name: Offline Lakehouse Pipeline Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate Dependencies & Imports
      run: |
        python -c "import deltalake, pyarrow, duckdb, confluent_kafka, psycopg2, pydantic, requests, dateutil"

    - name: Run Schema Contract & Unit Tests
      run: |
        pytest -v tests/test_unit_pipeline.py

    - name: Run Delta Lakehouse Integration Tests (Offline / Mock Stream)
      run: |
        pytest -v tests/test_integration_cdc.py tests/test_cdc_pipeline.py

    - name: Run High-Fidelity ERP CDC Stream Simulation
      run: |
        python scripts/simulate_erp_transactions.py --stream-mode

    - name: Run Gold Layer DuckDB OLAP Verification
      run: |
        python analytics/gold_analytics.py

  # Job 2: Live Docker Infrastructure Integration Test (Requires Docker Engine)
  test-live-docker:
    name: Live Infrastructure CDC Test (Postgres + Redpanda + Debezium)
    runs-on: ubuntu-latest
    needs: test-offline
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate Docker Compose Configuration
      run: |
        docker compose config

    - name: Start Live Services (Postgres, Redpanda, Debezium Connect)
      run: |
        docker compose up -d postgres-source kafka connect
        # Wait for services to pass health checks
        timeout 90 bash -c 'until curl -s -f http://localhost:8083/connectors; do sleep 3; done'
        echo "Debezium Connect is online."

    - name: Register Debezium PostgreSQL Connector
      run: |
        bash connectors/register-postgres.sh

    - name: Run Live PostgreSQL CDC Verification
      run: |
        python scripts/verify_cdc_replication.py

    - name: Run Live End-to-End Stack Verification (Postgres -> Debezium -> Redpanda -> Delta Lake -> DuckDB)
      run: |
        python scripts/verify_live_stack_e2e.py
