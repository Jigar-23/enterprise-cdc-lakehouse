name: Enterprise CDC Lakehouse CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Schema Contract & Lakehouse Pytest Suite
      run: |
        pytest -v --tb=short tests/

    - name: Run ERP CDC Stream Simulation
      run: |
        python scripts/simulate_erp_transactions.py

    - name: Validate Gold Analytics OLAP Engine
      run: |
        python analytics/gold_analytics.py
