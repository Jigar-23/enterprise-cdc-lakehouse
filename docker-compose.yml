version: '3.8'

services:
  # 1. Source Relational Database (Simulating SAP / ERP Transactional Store)
  postgres-source:
    image: debezium/postgres:15-alpine
    container_name: cdc_postgres_source
    environment:
      POSTGRES_USER: erp_admin
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: erp_database
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_admin -d erp_database"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. High-Performance Event Streaming Broker (Redpanda - Kafka API Compatible)
  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.11
    container_name: cdc_kafka_broker
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:9094
      - --advertise-kafka-addr PLAINTEXT://kafka:9092,OUTSIDE://localhost:9094
    ports:
      - "9092:9092"
      - "9094:9094"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -i healthy || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Debezium Change Data Capture Connect Engine
  debezium:
    image: debezium/connect:2.5
    container_name: cdc_debezium_connect
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: cdc_connect_configs
      OFFSET_STORAGE_TOPIC: cdc_connect_offsets
      STATUS_STORAGE_TOPIC: cdc_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    ports:
      - "8083:8083"
    depends_on:
      postgres-source:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # 4. S3-Compatible Object Storage for Medallion Lakehouse
  minio:
    image: minio/minio:RELEASE.2023-09-30T07-02-29Z
    container_name: cdc_minio_storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # 5. MinIO Bucket Initializer
  minio-init:
    image: minio/mc:latest
    container_name: cdc_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadminpassword;
      /usr/bin/mc mb local/lakehouse-bronze --ignore-existing;
      /usr/bin/mc mb local/lakehouse-silver --ignore-existing;
      /usr/bin/mc mb local/lakehouse-quarantine --ignore-existing;
      exit 0;
      "

volumes:
  minio_data:
